name: CI and automatic deployment

# 只处理 develop 分支推送；检查全部通过后自动部署同一提交。
on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅供本次临时 CI 容器使用，不是开发或生产凭据。
          MYSQL_ROOT_PASSWORD: ci-only-mysql-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify including real MySQL and Redis integration tests
        working-directory: backend
        env:
          AUTH_TEST_DB_PASSWORD: ci-only-mysql-password
        run: mvn --batch-mode --no-transfer-progress verify -Dredis.integration=true -Dauth.integration=true
      - name: Save test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Save checked JAR
        uses: actions/upload-artifact@v4
        with:
          name: checked-backend
          path: backend/target/ginkgo-food-map-backend-*.jar
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test, typecheck and build
        working-directory: frontend
        run: npm run check
      - name: Save checked frontend
        uses: actions/upload-artifact@v4
        with:
          name: checked-frontend
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy checked commit
    needs: [backend, frontend, deployment-checks]
    # 服务器 Runner 只执行本仓库可信 develop 的发布，构建与测试仍在 GitHub 托管机器运行。
    if: github.repository == 'kanno111/ginkgo-food-map-v2' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Linux, X64, ginkgo-deploy]
    timeout-minutes: 20
    # 不取消正在切换版本的部署，避免进程被中断后留下半完成状态。
    concurrency:
      group: ginkgo-server-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip a commit superseded while checks were running
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 使用系统 Python，服务器无需安装 gh，也不保存长期 GitHub 访问令牌。
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/develop"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'ginkgo-deployment',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              latest = json.load(response)['object']['sha']
          current = latest == os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"current={str(current).lower()}\n")
          if not current:
              print('A newer develop commit exists; skipping this deployment.')
          PY
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.current == 'true'
        with:
          name: checked-backend
          path: release/backend
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.current == 'true'
        with:
          name: checked-frontend
          path: release/frontend
      - name: Package the exact artifacts that passed checks
        if: steps.latest.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release/backend/*.jar)
          test "${#jars[@]}" -eq 1
          mv "${jars[0]}" release/backend.jar
          printf '%s\n' "$GITHUB_SHA" > release/commit.txt
          printf '%s\n' "$GITHUB_SHA" > release/frontend/version.txt
          tar -czf release.tar.gz -C release backend.jar frontend commit.txt
          sha256sum release.tar.gz > SHA256SUMS
      - name: Activate release on this server
        if: steps.latest.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Runner 由 ginkgo-deploy 运行，本地复制产物；自动发布不再连接入站 SSH。
          [[ "$(id -un)" == 'ginkgo-deploy' ]]
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$release_id" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]]
          incoming="/opt/ginkgo/incoming/${release_id}"
          mkdir -m 700 "$incoming"
          cp release.tar.gz SHA256SUMS deploy/deploy.sh deploy/healthcheck.py "$incoming/"
          bash "$incoming/deploy.sh" "$release_id"

  deployment-checks:
    name: Deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check script syntax and release failure handling
        run: |
          bash -n deploy/deploy.sh
          python3 -m unittest discover -s deploy/tests -v
