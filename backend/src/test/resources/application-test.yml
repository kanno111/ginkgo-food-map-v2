spring:
  datasource:
    url: jdbc:h2:mem:ginkgo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

app:
  user:
    verification-code:
      # 仅供自动化测试完成配置校验，不得复制到生产环境。
      hmac-secret: test-only-hmac-secret-at-least-32-characters
    verification-mail:
      from: no-reply@example.test
      subject-prefix: "[测试]"
