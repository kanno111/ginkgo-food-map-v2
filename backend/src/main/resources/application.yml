spring:
  servlet:
    multipart:
      # 单文件300KiB，额外为multipart边界预留少量空间；解码层再次校验实际内容。
      max-file-size: 300KB
      max-request-size: 320KB
  application:
    name: ginkgo-food-map-v2
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ginkgo_food_map?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 认证数据与其他本地 Redis 用途隔离；生产环境仍建议使用独立实例或 ACL。
      database: ${REDIS_DATABASE:4}
      timeout: 2s
  # SMTP 凭据只从环境变量注入；显式超时用于避免邮件服务器异常时长期占用请求线程。
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}
  cache:
    type: redis
    redis:
      key-prefix: "ginkgo:"
      time-to-live: 10m
  flyway:
    enabled: true
    locations: classpath:db/migration

# MyBatis-Plus 只负责对象映射和 SQL 执行，数据库结构仍完全由 Flyway 管理。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
      # Web 请求不依赖 SqlSession 级对象缓存；按语句隔离可避免重复查询共享同一可变 Entity 实例。
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: auto

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  file:
    oss:
      enabled: ${OSS_ENABLED:false}
      endpoint: ${OSS_ENDPOINT:}
      region: ${OSS_REGION:}
      bucket: ${OSS_BUCKET:}
      prefix: review-images/
      temporary-ttl: 24h
      cleanup-delay-ms: 60000
  user:
    # 注册规则属于 user 模块，允许域名支持逗号分隔的配置列表。
    registration:
      allowed-email-domains: ${AUTH_ALLOWED_EMAIL_DOMAINS:std.uestc.edu.cn}
      username-min-length: 3
      username-max-length: 32
      password-min-length: 8
      password-max-bytes: 72
    # 验证码属于用户注册与密码找回流程，由 user 模块管理。
    verification-code:
      length: 6
      time-to-live: 5m
      resend-cooldown: 60s
      max-attempts: 5
      email-hourly-limit: 5
      email-daily-limit: 10
      hmac-secret: ${AUTH_CODE_HMAC_SECRET:}
      # 所有 Lua 相关键共享同一 Redis Cluster hash tag，保证未来迁移集群后仍可原子执行。
      key-prefix: "auth:verification-code:{verification-code}"
    verification-mail:
      # 发件地址必须显式配置，避免开发默认值被误用于生产邮件。
      from: ${AUTH_MAIL_FROM:}
      subject-prefix: "[银杏美食地图]"
  security:
    authentication:
      # 私钥仅用于签发 JWT，公钥用于请求验证；密钥文件本身不得提交到 Git。
      jwt:
        issuer: ${JWT_ISSUER:ginkgo-food-map}
        audience: ${JWT_AUDIENCE:ginkgo-food-map-api}
        time-to-live: ${JWT_TTL:7d}
        private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:./secrets/jwt-private.pem}
        public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
      # 登录失败按稳定用户ID摘要计数；不存在的用户名按摘要计数，不采集客户端IP。
      login-protection:
        max-failed-attempts: 5
        failure-window: 15m
        lock-duration: 15m
